name: Portfolio demo checks
on:
  pull_request:
  push:
    branches: [main, codex/neon-render-demo-migration]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auctionpilot_tests
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d auctionpilot_tests"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      AUCTIONPILOT_TEST_CONNECTION: Host=localhost;Port=5432;Database=auctionpilot_tests;Username=postgres;Password=postgres;Maximum Pool Size=20
      VITE_API_URL: https://auctionpilot-demo-api.onrender.com/api
      VITE_SIGNALR_URL: https://auctionpilot-demo-api.onrender.com/hubs/auction
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: dotnet build backend/AuctionApi.csproj -c Release
      - run: dotnet test tests/AuctionApi.Tests/AuctionApi.Tests.csproj -c Release
      - run: dotnet run --project tests/UploadValidationSmoke/UploadValidationSmoke.csproj -c Release
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: docker build -f backend/Dockerfile -t auctionpilot-demo:ci .
